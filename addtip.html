<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Tip</title>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
    <h2 class="text-3xl font-bold mb-6 text-center text-blue-600">Add New Tip</h2>

    <form id="addTipForm" class="space-y-5">

      <div>
        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input type="text" id="title" placeholder="Enter title"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          required />
      </div>


      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea id="description" placeholder="Write your tip..." rows="4"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          required></textarea>
      </div>


      <div>
        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select id="category"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
          required>
          <option value="">Select Category</option>
          <option value="Coding">Coding</option>
          <option value="Design">Design</option>
          <option value="Career">Career</option>
          <option value="Life Hacks">Life Hacks</option>
        </select>
      </div>


      <div class="text-center">
        <button type="submit"
          class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition duration-200">
          Add Tip
        </button>
      </div>
    </form>
  </div>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="addtip.js"></script>
</body>

</html>
