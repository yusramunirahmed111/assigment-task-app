<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <style>
    body {
      background: radial-gradient(circle at top left, #7f5af0, #2cb67d);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans">

  <!-- Background bubbles -->
  <div class="absolute w-full h-full overflow-hidden -z-10">
    <div class="absolute bg-white opacity-10 rounded-full w-72 h-72 top-0 left-0 animate-pulse"></div>
    <div class="absolute bg-white opacity-10 rounded-full w-96 h-96 bottom-0 right-0 animate-spin-slow"></div>
  </div>

  <!-- Card -->
  <div class="backdrop-blur-xl bg-white/10 border border-white/20 shadow-2xl p-8 rounded-3xl w-full max-w-md text-white">
    <h1 class="text-4xl font-bold text-center mb-4">🚀 Create Account</h1>
   
    <input
    type="username"
    id="name"
    class="w-full px-4 py-3 mb-4 bg-white/20 text-white placeholder-white/70 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300 transition duration-300"
    placeholder="username" required />

    <input
      type="email"
      id="email"
      class="w-full px-4 py-3 mb-4 bg-white/20 text-white placeholder-white/70 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300 transition duration-300"
      placeholder="Email" required />

    <input
      type="password"
      id="password"
      class="w-full px-4 py-3 mb-6 bg-white/20 text-white placeholder-white/70 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300 transition duration-300"
      placeholder="Password" required />

    <button id="submit"
      class="w-full bg-gradient-to-r from-fuchsia-500 to-purple-500 hover:from-fuchsia-600 hover:to-purple-600 text-white py-3 rounded-lg font-semibold shadow-lg hover:shadow-xl transition duration-300">
      Sign Up
    </button>

    <p class="text-center text-sm mt-4 text-white/70">Already have an account?
      <a href="index.html" class="underline hover:text-white">Log in</a>
    </p>
  </div>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="sign.js"></script>
</body>
</html>
