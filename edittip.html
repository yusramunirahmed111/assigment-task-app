<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Tip</title>

</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="w-full max-w-xl bg-white rounded-lg shadow-md p-8">
    <h2 class="text-3xl font-semibold text-gray-800 mb-6 text-center">Edit Tip</h2>

    <form id="editTipForm" class="space-y-5">
      <div>
        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input
          type="text"
          id="title"
          placeholder="Enter a title"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition" />
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea
          id="description"
          placeholder="Write a short description..."
          required
          rows="4"
          class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition" ></textarea>
      </div>

      <div>
        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select
          id="category"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
          <option value="">Select Category</option>
          <option value="Coding">Coding</option>
          <option value="Design">Design</option>
          <option value="Career">Career</option>
          <option value="Life Hacks">Life Hacks</option>
        </select>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md transition">
        Save Changes
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("editTipForm");

    const editTipId = localStorage.getItem("editTipId");
    const tips = JSON.parse(localStorage.getItem("tips")) || [];
    const tipToEdit = tips.find(tip => tip.id == editTipId);

    
    if (tipToEdit) {
      form.title.value = tipToEdit.title;
      form.description.value = tipToEdit.description;
      form.category.value = tipToEdit.category;
     }

    form.onsubmit = (e) => {
      e.preventDefault();

      const updatedTip = {
        id: editTipId,
        title: form.title.value,
        description: form.description.value,
        category: form.category.value,
        timestamp: new Date().toLocaleString()
      };

  
      const updatedTips = tips.map(tip => tip.id === editTipId ? updatedTip : tip);
      localStorage.setItem("tips", JSON.stringify(updatedTips));

      alert("Tip updated successfully!");
      window.location.href = "mytips.html"; 
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
