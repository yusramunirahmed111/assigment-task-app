<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>task management </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">📋 Task management app</h1>

    <form id="addTipForm" class="bg-white rounded-xl shadow p-6 mb-6 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <input type="text" id="title" placeholder="Title" required class="border p-2 rounded-md w-full" />
        <input type="text" id="description" placeholder="Description" required class="border p-2 rounded-md w-full" />
        <input type="text" id="assign" placeholder="Assign to" class="border p-2 rounded-md w-full" />
      </div>
      <div class="text-right">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">➕ Add Task</button>
      </div>
    </form>

    <div id="tipCards" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </div>

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="task.js"></script>
  </script>
</body>
</html>
